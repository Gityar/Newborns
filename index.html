<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neonatal Nursing LMS</title>
<style>
:root{
  --ink:#0d1f26; --ink-soft:#35525d; --muted:#54707c;
  --brand:#0d7d76; --brand-600:#0a5f5a; --brand-50:#e7f4f3; --brand-100:#cfe9e6;
  --ok:#166534; --ok-50:#dcfce7; --bad:#b91c1c; --bad-50:#fee2e2;
  --warn:#b45309; --warn-50:#fef3e2;
  --bg:#eef5f5; --card:#fff; --line:#d3e3e6; --line-soft:#e8f1f2;
  --radius:18px; --radius-sm:12px;
  --shadow:0 2px 4px rgba(13,31,38,.06),0 14px 40px rgba(13,31,38,.10);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:17px;line-height:1.65;color:var(--ink);background:var(--bg)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
a{color:var(--brand-600)}
button{font-family:inherit}
:focus-visible{outline:3px solid #0e7490;outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
code{background:#eef6f6;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:.92em}

/* Top bar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:14px 22px;background:linear-gradient(100deg,#0b2f38,#0d4551 55%,#0d7d76);color:#eaf6f6;box-shadow:0 3px 14px rgba(11,47,56,.28)}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;display:grid;place-items:center;background:rgba(255,255,255,.15);border-radius:12px;font-size:22px}
.brand h1{font-size:1.1rem;margin:0;color:#fff}
.brand small{color:#a9cdcd;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);padding:7px 14px;border-radius:99px;font-size:.9rem;color:#fff}
.user-chip b{font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;font-size:.95rem;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-600)}
.btn.ghost{background:#eef6f6;color:var(--brand-600);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--brand-50)}
.btn.small{padding:8px 14px;font-size:.85rem}
.btn.danger{background:var(--bad);color:#fff}
.btn.danger:hover{background:#991b1b}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
.container{max-width:1280px;margin:0 auto;padding:26px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}
.card + .card{margin-top:18px}
.card h2{font-size:1.5rem}
.card h3{font-size:1.2rem;color:var(--brand-600);margin-top:1.4em}
.card p{max-width:75ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Auth */
.auth-wrap{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:30px 18px}
.auth-card{width:100%;max-width:500px}
.auth-card .logo-lg{width:64px;height:64px;margin:0 auto 14px;display:grid;place-items:center;background:var(--brand-50);border-radius:18px;font-size:32px}
.auth-card h2{text-align:center;margin-bottom:4px}
.auth-card .sub{text-align:center;color:var(--muted);margin-bottom:22px;font-size:.95rem}
.field{margin-bottom:14px;position:relative}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px;color:var(--ink-soft)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;font-size:1rem;font-family:inherit;border:2px solid var(--line);border-radius:10px;background:#fff;transition:.15s}
.field textarea{min-height:120px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.field .hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.auth-links{display:flex;justify-content:space-between;margin-top:14px;font-size:.9rem;flex-wrap:wrap;gap:8px}
.auth-links a{color:var(--brand-600);text-decoration:none;font-weight:600}
.auth-links a:hover{text-decoration:underline}
.tab-switch{display:flex;gap:6px;margin-bottom:18px;background:#f1f7f7;padding:5px;border-radius:12px;flex-wrap:wrap}
.tab-switch button{flex:1;min-width:70px;border:0;background:transparent;padding:9px 8px;border-radius:8px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--muted);transition:.15s}
.tab-switch button.active{background:#fff;color:var(--brand-600);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:14px;font-size:.92rem;border-left:4px solid;animation:slideIn .3s}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.alert.error{background:var(--bad-50);border-color:var(--bad);color:var(--bad)}
.alert.success{background:var(--ok-50);border-color:var(--ok);color:var(--ok)}
.alert.info{background:var(--brand-50);border-color:var(--brand);color:var(--brand-600)}
.alert code{background:rgba(255,255,255,.7);padding:4px 8px;border-radius:4px;font-size:1.1em;font-weight:700}
details.code-block{margin-top:12px;font-size:.85rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.code-block summary{cursor:pointer;font-weight:600;color:var(--muted);outline:none}
details.code-block summary:hover{color:var(--brand-600)}
details.code-block .code-inner{margin-top:10px;display:flex;align-items:center;gap:10px}
details.code-block .code-inner code{font-size:1.4rem;letter-spacing:.3em;font-weight:800;color:var(--brand-600);background:var(--brand-50);padding:8px 16px;border-radius:8px;flex:1;text-align:center}

/* Dashboard */
.hero{background:linear-gradient(135deg,#0b2f38,#0d7d76);color:#fff;padding:30px;border-radius:var(--radius);margin-bottom:20px}
.hero h2{font-size:1.8rem;margin:0 0 6px;color:#fff}
.hero p{color:#c9e7e7;margin:0;max-width:75ch}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:18px}
.stat .n{font-size:2rem;font-weight:800;color:var(--brand-600);line-height:1}
.stat .l{font-size:.85rem;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
.nav-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;background:#fff;padding:6px;border-radius:12px;border:1px solid var(--line)}
.nav-tabs button{border:0;background:transparent;padding:10px 16px;border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--muted);transition:.15s}
.nav-tabs button:hover{background:var(--brand-50)}
.nav-tabs button.active{background:var(--brand);color:#fff}

/* Tables (dashboard) */
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:560px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:middle}
thead th{background:#eef6f6;color:var(--brand-600);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;font-weight:800}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f7fbfb}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge.active{background:var(--ok-50);color:var(--ok)}
.badge.pending{background:var(--warn-50);color:var(--warn)}
.badge.suspended{background:var(--bad-50);color:var(--bad)}
.badge.admin{background:#ede9fe;color:#5b21b6}
.badge.instructor{background:#cffafe;color:#0e7490}
.badge.learner{background:#f1f7f7;color:var(--muted)}
select.inline{padding:6px 10px;font-size:.85rem;border:1px solid var(--line);border-radius:8px;background:#fff}

/* Content manager */
.module-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;background:#fff;transition:.15s}
.module-card:hover{border-color:var(--brand-100);box-shadow:var(--shadow-sm)}
.module-card h4{margin:0 0 4px;font-size:1.1rem}
.module-card .desc{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.module-card .meta{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.lesson-row,.quiz-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fbfefe;flex-wrap:wrap}
.lesson-row .info,.quiz-row .info{flex:1;min-width:0}
.lesson-row .info h5,.quiz-row .info h5{margin:0 0 4px;font-size:.98rem}
.lesson-row .info small,.quiz-row .info small{color:var(--muted);font-size:.82rem}
.quiz-row .opts{font-size:.85rem;color:var(--muted);margin-top:6px;line-height:1.6}
.quiz-row .opts b{color:var(--ok)}

/* Course player */
.player-grid{display:grid;grid-template-columns:320px 1fr;gap:20px}
.player-side{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto}
.player-side h3{font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
.mod-link{display:block;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem;margin-bottom:2px;border-left:3px solid transparent;transition:.15s}
.mod-link:hover{background:var(--brand-50)}
.mod-link.active{background:var(--brand-50);border-left-color:var(--brand);color:var(--brand-600);font-weight:700}
.lesson-link,.quiz-link{display:block;padding:8px 12px 8px 24px;border-radius:6px;text-decoration:none;color:var(--ink-soft);font-size:.86rem;margin-bottom:1px;cursor:pointer}
.lesson-link:hover,.quiz-link:hover{background:var(--brand-50)}
.lesson-link.active,.quiz-link.active{background:var(--brand-100);color:var(--brand-600);font-weight:600}
.player-main{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:28px;min-height:400px}
.player-main h2{font-size:1.6rem;margin-bottom:10px}

/* ---- LESSON CONTENT STYLES ---- */
.lesson-content{font-size:1rem;line-height:1.7;color:var(--ink)}
.lesson-content h2{font-size:1.35rem;color:var(--brand-600);margin-top:1.4em}
.lesson-content h3{font-size:1.15rem;color:var(--brand-600);margin-top:1.4em}
.lesson-content p{margin:0 0 1em;max-width:75ch}
.lesson-content ul,.lesson-content ol{margin:0 0 1em;padding-left:1.4em}
.lesson-content li{margin:.35em 0}
.lesson-content strong{font-weight:700}
.lesson-content code{background:#eef6f6;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:.9em}
.lesson-content img{max-width:100%;border-radius:8px}

.lesson-content .lesson-lead{font-size:1.08rem;color:var(--ink-soft);border-left:5px solid var(--brand);padding-left:16px;margin-bottom:1.5em;line-height:1.65}
.lesson-content .lesson-h{font-size:1.15rem;color:var(--brand-600);margin:1.8em 0 .7em;display:flex;align-items:center;gap:10px}
.lesson-content .lesson-h::before{content:"";width:6px;height:20px;background:var(--brand);border-radius:3px;flex:0 0 auto}
.lesson-content .lesson-html{margin-bottom:1.2em}

/* Callouts */
.lesson-content .lesson-callout{border-radius:var(--radius-sm);padding:16px 20px;margin:1.4em 0;border:1px solid var(--line);background:#f7fbfb;border-left:5px solid var(--brand)}
.lesson-content .lesson-callout h4{margin:0 0 .4em;font-size:.92rem;letter-spacing:.03em;text-transform:uppercase;color:var(--brand-600)}
.lesson-content .lesson-callout p:last-child,.lesson-content .lesson-callout ul:last-child,.lesson-content .lesson-callout ol:last-child{margin-bottom:0}
.lesson-content .lesson-callout.key{background:var(--brand-50)}
.lesson-content .lesson-callout.warn{background:var(--warn-50);border-left-color:var(--warn)}
.lesson-content .lesson-callout.warn h4{color:var(--warn)}
.lesson-content .lesson-callout.danger{background:var(--bad-50);border-left-color:var(--bad)}
.lesson-content .lesson-callout.danger h4{color:var(--bad)}
.lesson-content .lesson-callout.ok{background:var(--ok-50);border-left-color:var(--ok)}
.lesson-content .lesson-callout.ok h4{color:var(--ok)}

/* Lesson tables */
.lesson-content .lesson-tbl{margin:1.4em 0}
.lesson-content .lesson-tbl figcaption{font-size:.9rem;color:var(--muted);margin-bottom:8px;font-weight:700}
.lesson-content .lesson-tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
.lesson-content .lesson-tbl-scroll table{min-width:auto;font-size:.93rem}
.lesson-content .lesson-tbl-scroll th,.lesson-content .lesson-tbl-scroll td{padding:11px 14px;font-size:.93rem}
.lesson-content .lesson-tbl-scroll thead th{background:#eef6f6;color:var(--brand-600);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.lesson-content .lesson-tbl-scroll tbody th{background:#fafcfc;width:28%}

/* Lesson cards */
.lesson-content .lesson-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:1.6em 0}
.lesson-content .lesson-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;background:linear-gradient(180deg,#fff,#f9fcfc);box-shadow:var(--shadow-sm);transition:.15s}
.lesson-content .lesson-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--brand-100)}
.lesson-content .card-num{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;background:var(--brand);color:#fff;font-size:.85rem;font-weight:800;margin-bottom:10px}
.lesson-content .lesson-card h4{margin:0 0 6px;font-size:1rem}
.lesson-content .lesson-card p{margin:0;font-size:.92rem;color:var(--muted);line-height:1.55}

/* Lesson video */
.lesson-content .lesson-video{margin:1.6em 0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#0b2f38}
.lesson-content .video-frame{aspect-ratio:16/9;display:grid;place-items:center;gap:10px;text-align:center;background:radial-gradient(circle at 50% 40%,#12525e,#0b2f38 72%);color:#cfe9e6;padding:22px}
.lesson-content .video-play{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:rgba(94,234,212,.16);border:2px solid #5eead4;color:#5eead4;font-size:1.4rem;margin:0 auto 6px}
.lesson-content .video-frame strong{display:block;color:#fff;font-size:1rem}
.lesson-content .video-frame small{color:#9dc4c7;font-size:.82rem;max-width:44ch}

/* Lesson formula */
.lesson-content .lesson-formula{margin:1.4em 0;padding:18px 22px;border-radius:var(--radius-sm);background:#0b2f38;color:#e8f5f5;font-family:var(--mono);font-size:.95rem;line-height:1.9;overflow-x:auto}
.lesson-content .lesson-formula .fx-label{display:block;font-family:var(--font);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:#5eead4;margin-bottom:8px;font-weight:800}
.lesson-content .lesson-formula b{color:#fbbf24}

/* Lesson calc */
.lesson-content .lesson-calc{margin:1.6em 0;border:1px solid var(--line);border-radius:var(--radius-sm);padding:20px;background:linear-gradient(180deg,#f9fdfd,#fff)}
.lesson-content .calc-q{font-weight:600;margin-bottom:14px;font-size:1.02rem}
.lesson-content .calc-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.lesson-content .calc-row input{flex:1 1 150px;min-width:120px;padding:12px 14px;border:2px solid var(--line);border-radius:var(--radius-sm);font-size:1.05rem;font-family:var(--mono);font-weight:600}
.lesson-content .calc-row input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.lesson-content .calc-unit{font-weight:800;color:var(--ink-soft);font-size:.95rem}
.lesson-content .calc-feedback{margin-top:12px;padding:12px 16px;border-radius:var(--radius-sm);border-left:4px solid var(--brand);background:var(--brand-50);font-size:.95rem;line-height:1.55}
.lesson-content .calc-feedback.good{border-left-color:var(--ok);background:var(--ok-50)}
.lesson-content .calc-feedback.bad{border-left-color:var(--bad);background:var(--bad-50)}
.lesson-content .calc-feedback strong{display:block;margin-bottom:4px}
.lesson-content .lesson-btn{border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:.88rem;cursor:pointer;transition:.15s}
.lesson-content .lesson-btn.primary{background:var(--brand);color:#fff}
.lesson-content .lesson-btn.primary:hover{background:var(--brand-600)}

/* Lesson discussion */
.lesson-content .lesson-discuss{margin:1.6em 0;border:1px solid #d9e7ea;border-left:5px solid #0e7490;border-radius:var(--radius-sm);padding:20px;background:#f4fbfd}
.lesson-content .lesson-discuss h4{margin:0 0 8px;font-size:1rem;color:#0e7490;display:flex;gap:8px;align-items:center}
.lesson-content .discuss-prompt{font-size:.98rem;margin-bottom:12px;line-height:1.6}
.lesson-content .lesson-discuss textarea{width:100%;min-height:110px;resize:vertical;padding:12px 14px;font-family:inherit;font-size:.98rem;border:2px solid var(--line);border-radius:var(--radius-sm);background:#fff;line-height:1.6}
.lesson-content .lesson-discuss textarea:focus{outline:none;border-color:#0e7490;box-shadow:0 0 0 3px #cffafe}
.lesson-content .note-status{font-size:.82rem;color:var(--muted);margin-top:6px;min-height:1em;font-weight:600}

/* Lesson PBL */
.lesson-content .lesson-pbl{margin:1.6em 0;border:1px solid #f0d8b8;border-radius:var(--radius-sm);overflow:hidden;background:#fffdf8}
.lesson-content .pbl-header{background:linear-gradient(100deg,#b45309,#d97706);color:#fff;padding:14px 20px;font-weight:800;font-size:.95rem;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.lesson-content .pbl-body{padding:18px 20px}
.lesson-content .pbl-scenario{background:#fff;border:2px dashed #e7c9a0;border-radius:var(--radius-sm);padding:16px;margin-bottom:14px;font-size:.98rem;line-height:1.65}
.lesson-content .pbl-body ol{margin-bottom:0;font-size:.98rem}

/* Lesson checklist */
.lesson-content .lesson-checklist{margin:1.6em 0;border:1px solid var(--line);border-radius:var(--radius-sm);padding:20px;background:#fbfefe}
.lesson-content .lesson-checklist h4{margin:0 0 12px;font-size:1rem;color:var(--brand-600)}
.lesson-content .lesson-checklist label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.97rem;transition:background .15s;line-height:1.5}
.lesson-content .lesson-checklist label:hover{background:var(--brand-50)}
.lesson-content .lesson-checklist input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand);flex:0 0 auto;cursor:pointer}
.lesson-content .lesson-checklist input:checked + span{color:var(--muted);text-decoration:line-through}

/* Quiz taking */
.quiz-take{background:#fbfefe;border:1px solid var(--line);border-radius:12px;padding:22px}
.quiz-take .qtext{font-weight:600;font-size:1.1rem;margin-bottom:16px}
.quiz-take .option{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:2px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;background:#fff;transition:.15s;width:100%;text-align:left;font-size:1rem;color:var(--ink)}
.quiz-take .option:hover:not(:disabled){border-color:var(--brand);background:var(--brand-50);transform:translateX(3px)}
.quiz-take .option .key{flex:0 0 28px;height:28px;display:grid;place-items:center;background:#eef6f6;color:var(--brand-600);font-weight:800;border-radius:8px;font-size:.9rem}
.quiz-take .option.correct{border-color:var(--ok);background:var(--ok-50)}
.quiz-take .option.correct .key{background:var(--ok);color:#fff}
.quiz-take .option.wrong{border-color:var(--bad);background:var(--bad-50)}
.quiz-take .option.wrong .key{background:var(--bad);color:#fff}
.quiz-take .option:disabled{cursor:default;opacity:1}
.quiz-take .option.dim{opacity:.5}
.quiz-feedback{margin-top:16px;padding:14px 18px;border-radius:10px;border-left:4px solid var(--brand);background:var(--brand-50);font-size:.98rem;animation:slideIn .3s}
.quiz-feedback.good{border-left-color:var(--ok);background:var(--ok-50)}
.quiz-feedback.bad{border-left-color:var(--bad);background:var(--bad-50)}
.quiz-feedback strong{display:block;margin-bottom:4px}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1 / -1}
@media (max-width:720px){.form-grid{grid-template-columns:1fr}}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-row label{display:flex;align-items:center;gap:6px;padding:9px 16px;border:2px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;background:#fff;transition:.15s}
.radio-row label:has(input:checked){border-color:var(--brand);background:var(--brand-50);color:var(--brand-600)}
.radio-row input{accent-color:var(--brand)}

/* OSCE */
.osce-domain{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fbfefe}
.osce-domain .label{font-weight:600;font-size:.92rem}
.osce-domain .radios{display:flex;gap:6px}
.osce-domain .radios label{display:flex;align-items:center;gap:4px;padding:7px 12px;border:2px solid var(--line);border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;background:#fff;min-width:52px;justify-content:center}
.osce-domain .radios label:has(input:checked){border-color:var(--brand);background:var(--brand-50);color:var(--brand-600)}
.score-banner{padding:14px 20px;border-radius:12px;font-weight:700;text-align:center;font-size:1.1rem;margin:14px 0;transition:.2s}
.score-banner.pass{background:var(--ok-50);color:var(--ok)}
.score-banner.fail{background:var(--bad-50);color:var(--bad)}

/* Certificate */
.cert{background:linear-gradient(135deg,#fff,#f1f9f8);border:3px solid var(--brand);border-radius:18px;padding:40px 34px;text-align:center;position:relative;box-shadow:var(--shadow)}
.cert::before{content:"";position:absolute;inset:10px;border:2px solid var(--brand-100);border-radius:12px;pointer-events:none}
.cert .seal{width:80px;height:80px;margin:0 auto 14px;background:var(--brand);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:34px}
.cert h2{font-size:1.8rem;color:var(--brand-600);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.cert .cert-sub{color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.15em;margin-bottom:20px}
.cert .name{font-size:2rem;font-weight:800;color:var(--ink);margin:14px 0 4px;font-family:Georgia,serif}
.cert .desc{max-width:540px;margin:14px auto;color:var(--ink-soft);font-size:.98rem}
.cert .meta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:22px;font-size:.82rem;color:var(--muted)}
.cert .meta div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.cert .meta b{display:block;color:var(--brand-600);font-size:.92rem;margin-top:2px}

/* Toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);background:#0b2f38;color:#e8f5f5;padding:14px 24px;border-radius:99px;font-size:.92rem;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.28s;z-index:90}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .icon{font-size:2.6rem;margin-bottom:8px;opacity:.5}
@media (max-width:900px){.player-grid{grid-template-columns:1fr}.player-side{position:static;max-height:none}}
@media (max-width:600px){.topbar{padding:12px 14px;gap:10px}.brand h1{font-size:.95rem}.brand small{display:none}.user-chip{font-size:.78rem;padding:6px 10px}.container{padding:18px 12px 40px}.card{padding:18px}.osce-domain{grid-template-columns:1fr}}
@media print{.topbar,.nav-tabs,.btn,footer,.player-side,.toast{display:none!important}body{background:#fff}.card,.player-main{box-shadow:none;border:0;padding:0}.cert{box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script>
/* ============================================================
   CONFIG & HELPERS
   ============================================================ */
const API = window.LMS_CONFIG?.API_URL || '';
const PASS_THRESHOLD = window.LMS_CONFIG?.PASS_THRESHOLD || 80;
if (!API || API.includes('PASTE')) console.error('[LMS] config.js missing Apps Script URL.');

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d ? new Date(d).toLocaleString() : '—';

let toastQueue = [];
let toastTimer = null;
function toast(msg){
  toastQueue.push(msg);
  if(toastTimer) return;
  flushToast();
}
function flushToast(){
  const t = $('#toast');
  if(!toastQueue.length){ t.classList.remove('show'); toastTimer = null; return; }
  t.textContent = toastQueue.shift();
  t.classList.add('show');
  toastTimer = setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => { toastTimer = null; flushToast(); }, 300);
  }, 1800);
}

async function api(action, payload={}){
  if(!API || API.includes('PASTE')) throw new Error('config.js is missing your Apps Script URL.');
  const res = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, payload))
  });
  const data = await res.json();
  if(!data.ok){
    if(data.code === 401){
      clearSession();
      render();
      throw new Error('Session expired. Please log in again.');
    }
    throw new Error(data.error || 'Request failed');
  }
  return data.data;
}

/* ============================================================
   SESSION
   ============================================================ */
const SK = 'nn_lms_session_v3';
const getSession = () => { try { return JSON.parse(localStorage.getItem(SK)); } catch { return null; } };
const setSession = s => localStorage.setItem(SK, JSON.stringify(s));
const clearSession = () => localStorage.removeItem(SK);
const currentUser = () => getSession()?.user || null;
const currentToken = () => getSession()?.token || '';

/* ============================================================
   CONTENT CACHE
   ============================================================ */
const CK = 'nn_lms_content_v3';
const CK_EXP = 'nn_lms_content_exp_v3';
function getCachedContent(){
  try {
    if(Number(localStorage.getItem(CK_EXP)||0) < Date.now()) return null;
    return JSON.parse(localStorage.getItem(CK)||'null');
  } catch { return null; }
}
function setCachedContent(c){
  try {
    localStorage.setItem(CK, JSON.stringify(c));
    localStorage.setItem(CK_EXP, String(Date.now() + 3*60*1000));
  } catch {}
}
function clearCachedContent(){
  try { localStorage.removeItem(CK); localStorage.removeItem(CK_EXP); } catch {}
}

/* ============================================================
   STATE
   ============================================================ */
const STATE = {
  authTab: 'login',
  authEmail: '',
  view: 'overview',
  content: null,
  contentFresh: false,
  cpModuleId: null,
  cpLessonId: null,
  cpQuizId: null,
  cmModuleId: null,
  editingLesson: null,
  editingQuiz: null,
  editingModule: null,
  resetInfo: null,
  userData: {} // DataKey -> DataValue for the current user
};

/* ============================================================
   ROOT
   ============================================================ */
function render(){
  const u = currentUser();
  if(!u){ renderAuth(); return; }
  renderApp();
}

/* ============================================================
   AUTH
   ============================================================ */
function renderAuth(){
  const t = STATE.authTab;
  const tabs = [['login','Login'],['register','Register'],['forgot','Forgot'],['reset','Reset']];
  $('#app').innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card card">
        <div class="logo-lg">👶</div>
        <h2>Neonatal Nursing LMS</h2>
        <p class="sub">Course · OSCE · Certification</p>
        <div class="tab-switch">
          ${tabs.map(([k,l]) => `<button class="${t===k?'active':''}" onclick="switchAuth('${k}')">${l}</button>`).join('')}
        </div>
        <div id="auth-alert"></div>
        ${t==='login'    ? authLoginForm()    : ''}
        ${t==='register' ? authRegisterForm() : ''}
        ${t==='forgot'   ? authForgotForm()   : ''}
        ${t==='reset'    ? authResetForm()    : ''}
      </div>
    </div>
  `;
  $('#auth-form').addEventListener('submit', handleAuthSubmit);
}

function authLoginForm(){
  return `<form id="auth-form" data-mode="login">
    <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="username" value="${esc(STATE.authEmail)}"></div>
    <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
    <button type="submit" class="btn primary" style="width:100%;margin-top:6px">Sign in</button>
    <div class="auth-links">
      <a href="#" onclick="switchAuth('register');return false">Create account</a>
      <a href="#" onclick="switchAuth('forgot');return false">Forgot password?</a>
    </div>
  </form>`;
}
function authRegisterForm(){
  return `<form id="auth-form" data-mode="register">
    <div class="field"><label>Full name</label><input type="text" name="name" required></div>
    <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div>
    <div class="field"><label>Password (min 8 chars)</label><input type="password" name="password" required minlength="8" autocomplete="new-password"></div>
    <div class="field"><label>Register as</label><select name="role">
      <option value="learner">Learner</option>
      <option value="instructor">Instructor</option>
      <option value="admin">Administrator</option>
    </select></div>
    <p style="font-size:.82rem;color:var(--muted);margin:0 0 12px">Instructor and admin accounts require approval by an existing administrator.</p>
    <button type="submit" class="btn primary" style="width:100%">Create account</button>
  </form>`;
}
function authForgotForm(){
  return `<form id="auth-form" data-mode="forgot">
    <div class="field">
      <label>Email address</label>
      <input type="email" name="email" required value="${esc(STATE.authEmail)}" autocomplete="email">
      <div class="hint">We'll send a 6-digit code. It expires in 30 minutes.</div>
    </div>
    <button type="submit" class="btn primary" style="width:100%">Send reset code</button>
    <div class="auth-links"><a href="#" onclick="switchAuth('login');return false">← Back to login</a></div>
  </form>`;
}
function authResetForm(){
  const info = STATE.resetInfo;
  const initialCode = info?.code || '';
  const showCodeBlock = info?.code
    ? `<details class="code-block" ${!info.emailed ? 'open' : ''}>
         <summary>${info.emailed ? 'Having trouble receiving the email? Show code' : 'Email service unavailable — use this code'}</summary>
         <div class="code-inner">
           <code id="reset-code-display">${esc(info.code)}</code>
           <button type="button" class="btn ghost small" onclick="copyText('${esc(info.code)}')">Copy</button>
         </div>
       </details>`
    : '';
  return `<form id="auth-form" data-mode="reset">
    <div class="field"><label>Email address</label><input type="email" name="email" required value="${esc(info?.email || STATE.authEmail)}" autocomplete="email"></div>
    <div class="field">
      <label>6-digit reset code</label>
      <input type="text" name="code" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" value="${esc(initialCode)}">
      ${info ? `<div class="hint">Code expires in ${info.expiresInMinutes || 30} minutes.</div>` : ''}
    </div>
    <div class="field"><label>New password (min 8 chars)</label><input type="password" name="password" required minlength="8" autocomplete="new-password"></div>
    <button type="submit" class="btn primary" style="width:100%">Reset password</button>
    ${showCodeBlock}
    <div class="auth-links">
      <a href="#" onclick="resendCode();return false">Resend code</a>
      <a href="#" onclick="switchAuth('login');return false">← Back to login</a>
    </div>
  </form>`;
}
function copyText(txt){ navigator.clipboard?.writeText(txt).then(()=>toast('Copied')).catch(()=>toast('Copy failed')); }
function switchAuth(tab){ STATE.authTab = tab; if(tab !== 'reset') STATE.resetInfo = null; renderAuth(); }

async function handleAuthSubmit(e){
  e.preventDefault();
  const mode = e.target.dataset.mode;
  const form = new FormData(e.target);
  const alert = $('#auth-alert');
  alert.innerHTML = '';
  const btn = e.target.querySelector('button[type=submit]');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Please wait…';
  try {
    if(mode === 'login'){
      const email = String(form.get('email') || '').trim().toLowerCase();
      STATE.authEmail = email;
      const d = await api('login', { email, password: form.get('password') });
      setSession({ token: d.token, user: d.user, issued: Date.now() });
      toast('Welcome back, ' + d.user.name);
      STATE.view = 'overview';
      STATE.userData = {};
      render();
    } else if(mode === 'register'){
      const d = await api('register', { name: form.get('name'), email: form.get('email'), password: form.get('password'), role: form.get('role') });
      alert.innerHTML = `<div class="alert success">Account created (${esc(d.status)}). ${d.status==='pending' ? 'Awaiting admin approval.' : 'You may now log in.'}</div>`;
      if(d.status === 'active') setTimeout(()=>switchAuth('login'), 1500);
    } else if(mode === 'forgot'){
      const email = String(form.get('email') || '').trim().toLowerCase();
      STATE.authEmail = email;
      const d = await api('forgot', { email });
      STATE.resetInfo = { email, code: d.code || '', emailed: d.emailed, expiresInMinutes: d.expiresInMinutes || 30 };
      alert.innerHTML = `<div class="alert info">${esc(d.message)}</div>`;
      setTimeout(()=>switchAuth('reset'), 900);
    } else if(mode === 'reset'){
      const email = String(form.get('email') || '').trim().toLowerCase();
      STATE.authEmail = email;
      const d = await api('reset', { email, code: form.get('code'), password: form.get('password') });
      alert.innerHTML = `<div class="alert success">${esc(d.message)}</div>`;
      STATE.resetInfo = null;
      setTimeout(()=>switchAuth('login'), 1200);
    }
  } catch(err){
    alert.innerHTML = `<div class="alert error">${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

async function resendCode(){
  const email = STATE.resetInfo?.email || STATE.authEmail;
  if(!email){ toast('Enter your email first'); return; }
  try {
    const d = await api('forgot', { email });
    STATE.resetInfo = { email, code: d.code || '', emailed: d.emailed, expiresInMinutes: d.expiresInMinutes || 30 };
    toast(d.emailed ? 'New code sent to your email' : 'New code generated');
    renderAuth();
  } catch(e){ toast(e.message); }
}

async function logout(){
  try { await api('logout', { token: currentToken() }); } catch {}
  clearSession();
  STATE.authTab = 'login'; STATE.view = 'overview'; STATE.content = null;
  STATE.resetInfo = null; STATE.userData = {};
  render();
}

/* ============================================================
   APP SHELL
   ============================================================ */
function renderApp(){
  const u = currentUser();
  const tabs = [['overview','🏠 Overview'],['course','📚 Course']];
  if(u.role === 'learner'){ tabs.push(['myOsce','🎯 My OSCE']); tabs.push(['myCerts','🏆 My Certificates']); }
  if(u.role === 'instructor' || u.role === 'admin'){
    tabs.push(['contentMgr','✏️ Content Manager']);
    tabs.push(['osceEntry','📝 Score OSCE']);
    tabs.push(['records','📊 OSCE Records']);
    tabs.push(['certs','🏆 Certificates']);
  }
  if(u.role === 'admin'){ tabs.push(['users','👥 Users']); tabs.push(['audit','📜 Audit']); }
  $('#app').innerHTML = `
    ${topbar()}
    <div class="container">
      <div class="nav-tabs">
        ${tabs.map(([k,l])=>`<button class="${STATE.view===k?'active':''}" onclick="setView('${k}')">${l}</button>`).join('')}
      </div>
      <div id="view-root"></div>
    </div>
  `;
  renderView();
}
function topbar(){
  const u = currentUser();
  return `<header class="topbar">
    <div class="brand"><div class="logo">👶</div><div><h1>Neonatal Nursing LMS</h1><small>Course · OSCE · Certification</small></div></div>
    <div class="spacer"></div>
    <div class="user-chip"><span>👤 <b>${esc(u.name)}</b></span><span class="badge ${esc(u.role)}">${esc(u.role)}</span></div>
    <button class="btn ghost small" onclick="logout()">Logout</button>
  </header>`;
}
function setView(v){
  STATE.view = v;
  if(v === 'contentMgr') STATE.cmModuleId = null;
  render();
}
function renderView(){
  const root = $('#view-root');
  switch(STATE.view){
    case 'overview':   root.innerHTML = viewOverview(); break;
    case 'course':     root.innerHTML = viewCourse(); loadContent('course'); break;
    case 'contentMgr': root.innerHTML = viewContentMgr(); loadContent('cm'); break;
    case 'myOsce':     root.innerHTML = viewMyOsce(); loadMyOsce(); break;
    case 'myCerts':    root.innerHTML = viewMyCerts(); loadMyCerts(); break;
    case 'osceEntry':  root.innerHTML = viewOsceEntry(); renderDomainInputs(); break;
    case 'records':    root.innerHTML = viewRecords(); loadRecords(); break;
    case 'certs':      root.innerHTML = viewCerts(); loadCerts(); break;
    case 'users':      root.innerHTML = viewUsers(); loadUsers(); break;
    case 'audit':      root.innerHTML = viewAudit(); loadAudit(); break;
  }
}

/* ============================================================
   OVERVIEW
   ============================================================ */
function viewOverview(){
  const u = currentUser();
  const c = STATE.content?.modules || getCachedContent()?.modules || [];
  const totalLessons = c.reduce((a,m)=>a+m.Lessons.length,0);
  const totalQuizzes = c.reduce((a,m)=>a+m.Quizzes.length,0);
  return `<div class="hero">
    <h2>Welcome back, ${esc(u.name)}</h2>
    <p>${u.role === 'learner' ? 'Continue the course, take quizzes, and complete the OSCE to earn your certificate (80% required).' :
      u.role === 'instructor' ? 'Manage course content, score OSCE assessments, and track learner progress.' :
      'Full administrative access: manage users, content, assessments, certificates, and audit logs.'}</p>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="n">${c.length}</div><div class="l">Modules</div></div>
    <div class="stat"><div class="n">${totalLessons}</div><div class="l">Lessons</div></div>
    <div class="stat"><div class="n">${totalQuizzes}</div><div class="l">Quizzes</div></div>
    <div class="stat"><div class="n">${PASS_THRESHOLD}%</div><div class="l">OSCE Pass Mark</div></div>
  </div>
  <div class="card">
    <h2>Quick actions</h2>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" onclick="setView('course')">📚 Open Course</button>
      ${u.role==='learner' ? `<button class="btn ghost" onclick="setView('myCerts')">🏆 My Certificates</button>` : ''}
      ${(u.role==='instructor'||u.role==='admin') ? `<button class="btn ghost" onclick="setView('contentMgr')">✏️ Content Manager</button>` : ''}
      ${(u.role==='instructor'||u.role==='admin') ? `<button class="btn ghost" onclick="setView('osceEntry')">📝 Score OSCE</button>` : ''}
      ${u.role==='admin' ? `<button class="btn ghost" onclick="setView('users')">👥 Manage Users</button>` : ''}
    </div>
  </div>`;
}

/* ============================================================
   COURSE PLAYER
   ============================================================ */
function viewCourse(){
  return `<div class="card">
    <div class="between" style="margin-bottom:18px">
      <div>
        <h2 style="margin:0">📚 Course Player</h2>
        <p style="margin:4px 0 0;color:var(--muted);font-size:.92rem">Browse modules, read lessons, answer quizzes, save reflections.</p>
      </div>
      <button class="btn ghost small" onclick="loadContent('course', true)">↻ Refresh</button>
    </div>
    <div id="course-body">
      <div class="empty"><div class="icon">⏳</div>Loading content…</div>
    </div>
  </div>`;
}

function renderCourseBody(){
  const body = $('#course-body');
  if(!body || !STATE.content) return;
  const mods = STATE.content.modules;
  if(!mods.length){
    body.innerHTML = `<div class="empty"><div class="icon">📭</div>
      <p>No modules yet.</p>
      <p style="font-size:.9rem">${currentUser().role !== 'learner'
        ? 'Add them in the <a href="#" onclick="setView(\'contentMgr\');return false">Content Manager</a>, or run <code>seedCourseContent()</code> in Apps Script.'
        : 'Check back soon — your instructor is preparing content.'}</p></div>`;
    return;
  }
  const curMod = STATE.cpModuleId ? mods.find(m => m.ModuleID === STATE.cpModuleId) : null;
  body.innerHTML = `
    <div class="player-grid">
      <aside class="player-side">
        <h3>Modules</h3>
        ${mods.map(m => `
          <a href="#" class="mod-link ${m.ModuleID===STATE.cpModuleId?'active':''}" onclick="openCpModule('${esc(m.ModuleID)}');return false">${esc(m.Title)}</a>
          ${m.ModuleID===STATE.cpModuleId ? `
            ${m.Lessons.map(l => `<a class="lesson-link ${l.LessonID===STATE.cpLessonId?'active':''}" onclick="openCpLesson('${esc(l.LessonID)}');return false">📖 ${esc(l.Title)}</a>`).join('')}
            ${m.Quizzes.map((q,i) => `<a class="quiz-link ${q.QuizID===STATE.cpQuizId?'active':''}" onclick="openCpQuiz('${esc(q.QuizID)}');return false">📝 Quiz ${i+1}</a>`).join('')}
          ` : ''}
        `).join('')}
      </aside>
      <section class="player-main">${renderPlayerMain(curMod)}</section>
    </div>
  `;

  /* Bind lesson interactions AFTER the HTML is inserted */
  if(STATE.cpLessonId && curMod){
    const lesson = curMod.Lessons.find(l => l.LessonID === STATE.cpLessonId);
    if(lesson){
      setTimeout(() => {
        bindLessonInteractions(lesson.LessonID);
        loadUserDataForLesson(lesson.LessonID);
      }, 0);
    }
  }
}

function renderPlayerMain(mod){
  if(!mod) return `<div class="empty"><div class="icon">👈</div>Select a module from the left to begin.</div>`;
  if(STATE.cpLessonId){
    const lesson = mod.Lessons.find(l => l.LessonID === STATE.cpLessonId);
    if(lesson){
      return `<h2>${esc(lesson.Title)}</h2>
        <div class="lesson-content">${lesson.ContentHTML || '<p><em>No content yet.</em></p>'}</div>`;
    }
  }
  if(STATE.cpQuizId){
    const quiz = mod.Quizzes.find(q => q.QuizID === STATE.cpQuizId);
    if(quiz) return renderQuizTake(quiz);
  }
  return `<h2>${esc(mod.Title)}</h2>
    <p style="color:var(--muted)">${esc(mod.Description || '')}</p>
    <h3>Lessons (${mod.Lessons.length})</h3>
    ${mod.Lessons.length ? mod.Lessons.map(l => `<div class="lesson-row">
      <div class="info"><h5>📖 ${esc(l.Title)}</h5></div>
      <button class="btn ghost small" onclick="openCpLesson('${esc(l.LessonID)}')">Read</button>
    </div>`).join('') : '<p><em>No lessons yet.</em></p>'}
    <h3>Quizzes (${mod.Quizzes.length})</h3>
    ${mod.Quizzes.length ? mod.Quizzes.map((q,i) => `<div class="quiz-row">

async function submitQuizAttempt(quizId, idx, btn){
  const wrap = btn.closest('.quiz-take');
  if(!wrap) return;
  wrap.querySelectorAll('.option').forEach(b => b.disabled = true);
  try {
    const d = await api('submitQuiz', { token: currentToken(), quizId, chosenIndex: idx });
    wrap.querySelectorAll('.option').forEach(b => {
      const i = Number(b.dataset.opt);
      if(i === d.correctIndex) b.classList.add('correct');
      else if(i === idx) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    wrap.querySelector('.feedback-slot').innerHTML = `<div class="quiz-feedback ${d.correct?'good':'bad'}">
      <strong>${d.correct ? '✓ Correct!' : '✗ Not quite'}</strong>${esc(d.explanation || '')}
    </div>`;
  } catch(e){
    toast(e.message);
    wrap.querySelectorAll('.option').forEach(b => b.disabled = false);
  }
}

async function loadContent(mode, force){
  const cached = getCachedContent();
  if(cached && !force && (!STATE.content || STATE.content.modules !== cached.modules)){
    STATE.content = cached;
    if(mode === 'course') renderCourseBody();
    else if(mode === 'cm') renderCmBody();
  }
  try {
    const d = await api('listContent', { token: currentToken() });
    STATE.content = d;
    setCachedContent(d);
    if(mode === 'course') renderCourseBody();
    else if(mode === 'cm') renderCmBody();
  } catch(e){
    const el = mode === 'course' ? $('#course-body') : $('#cm-body');
    if(el && !cached) el.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
    else if(!cached) toast(e.message);
  }
}

/* ============================================================
   LESSON INTERACTIONS (calculators, discussions, checklists)
   ============================================================ */

function bindLessonInteractions(lessonId){
  const root = $('.lesson-content');
  if(!root) return;

  // Calculation check buttons
  root.querySelectorAll('.lesson-calc').forEach(box => {
    const btn = box.querySelector('[data-calc-check]');
    if(!btn || btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', () => {
      const input = box.querySelector('input');
      const fb = box.querySelector('.calc-feedback');
      const answer = parseFloat(box.dataset.answer);
      const tol = parseFloat(box.dataset.tol || '0.01');
      const solution = box.dataset.solution || '';
      const val = parseFloat(input.value);
      fb.hidden = false;
      if(isNaN(val)){
        fb.className = 'calc-feedback bad';
        fb.innerHTML = '<strong>Enter a number</strong>Please type your calculated answer before checking.';
        return;
      }
      const ok = Math.abs(val - answer) <= tol;
      fb.className = 'calc-feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = `<strong>${ok ? '✓ Correct' : '✗ Try again'}</strong>` +
        (ok ? solution : 'Recheck your units and order of operations, then try once more.');
    });
  });

  // Discussion textareas — autosave to backend
  root.querySelectorAll('textarea[data-note-key]').forEach(ta => {
    if(ta.dataset.bound) return;
    ta.dataset.bound = '1';
    let timer = null;
    ta.addEventListener('input', () => {
      const key = ta.dataset.noteKey;
      STATE.userData[key] = ta.value;
      const status = document.querySelector(`[data-note-status="${key}"]`);
      if(status) status.textContent = 'Saving…';
      clearTimeout(timer);
      timer = setTimeout(async () => {
        try {
          await api('saveUserData', { token: currentToken(), dataType: 'note', dataKey: key, dataValue: ta.value });
          if(status) status.textContent = '✓ Saved';
        } catch(e){
          if(status) status.textContent = '⚠ Could not save';
        }
      }, 700);
    });
  });

  // Checklists — save on change
  root.querySelectorAll('input[data-check-key]').forEach(cb => {
    if(cb.dataset.bound) return;
    cb.dataset.bound = '1';
    cb.addEventListener('change', async () => {
      const key = cb.dataset.checkKey;
      STATE.userData[key] = cb.checked ? 'true' : 'false';
      try {
        await api('saveUserData', { token: currentToken(), dataType: 'checklist', dataKey: key, dataValue: cb.checked ? 'true' : 'false' });
      } catch(e){ /* silent */ }
    });
  });
}

async function loadUserDataForLesson(lessonId){
  try {
    const d = await api('getUserData', { token: currentToken(), prefix: lessonId + ':' });
    Object.entries(d.data || {}).forEach(([key, value]) => {
      STATE.userData[key] = value;
      const ta = document.querySelector(`textarea[data-note-key="${key}"]`);
      if(ta){ ta.value = value; const s = document.querySelector(`[data-note-status="${key}"]`); if(s) s.textContent = '✓ Saved'; }
      const cb = document.querySelector(`input[data-check-key="${key}"]`);
      if(cb) cb.checked = value === 'true';
    });
  } catch(e){ /* silent */ }
}

const OSCE_DOMAINS = [
  'Domain 1 — Preparation & Infection Control',
  'Domain 2 — Initial Thermal & Airway Management',
  'Domain 3 — Rapid Assessment & APGAR Evaluation',
  'Domain 4 — Positive Pressure Ventilation (PPV) Execution',
  'Domain 5 — Corrective Measures (MR. SOPA)',
  'Domain 6 — Chest Compressions at 3:1 Ratio',
  'Domain 7 — Medication Preparation & Administration',
  'Domain 8 — Team Communication & Closed-Loop Practice',
  'Domain 9 — Documentation & Timekeeping',
  'Domain 10 — Professionalism, Safety & Family Communication'
];
function viewOsceEntry(){
  return `<div class="card">
    <h2>📝 OSCE Assessment</h2>
    <p>Score each of the 10 domains (0, 1 or 2). Learners scoring ${PASS_THRESHOLD}%+ receive a certificate automatically.</p>
    <form id="osce-form" style="margin-top:16px" onsubmit="submitOsce(event)">
      <div class="field"><label>Learner email</label><input type="email" name="learnerEmail" required placeholder="learner@example.com"></div>
      <div id="domain-list" style="margin:18px 0"></div>
      <div class="field"><label>Assessor notes</label><input type="text" name="notes" placeholder="Optional"></div>
      <div class="score-banner" id="score-banner">Score: 0 / 20 · 0%</div>
      <button type="submit" class="btn primary" style="width:100%">Submit OSCE</button>
    </form>
    <div id="osce-result"></div>
  </div>`;
}
function renderDomainInputs(){
  const el = $('#domain-list');
  if(!el) return;
  el.innerHTML = OSCE_DOMAINS.map((label,i) => `<div class="osce-domain">
    <div class="label">${label}</div>
    <div class="radios">
      ${[0,1,2].map(v => `<label><input type="radio" name="d${i+1}" value="${v}" ${v===0?'checked':''} onchange="updateScore()"> ${v}</label>`).join('')}
    </div>
  </div>`).join('');
  updateScore();
}
function updateScore(){
  let total = 0;
  for(let i=1;i<=10;i++){
    const v = document.querySelector(`input[name="d${i}"]:checked`);
    total += v ? Number(v.value) : 0;
  }
  const pct = Math.round((total/20)*1000)/10;
  const pass = pct >= PASS_THRESHOLD;
  const b = $('#score-banner');
  if(!b) return;
  b.className = 'score-banner ' + (pass?'pass':'fail');
  b.textContent = `Score: ${total} / 20 · ${pct}% ${pass?'✓ PASS':'✗ FAIL'}`;
}
async function submitOsce(ev){
  ev.preventDefault();
  const f = new FormData(ev.target);
  const payload = { token: currentToken(), learnerEmail: f.get('learnerEmail'), notes: f.get('notes')||'' };
  for(let i=1;i<=10;i++) payload['d'+i] = Number(f.get('d'+i));
  const r = $('#osce-result');
  const btn = ev.target.querySelector('button[type=submit]');
  const orig = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Submitting…';
  r.innerHTML = '';
  try {
    const d = await api('submitOsce', payload);
    r.innerHTML = `<div class="alert ${d.pass?'success':'error'}" style="margin-top:16px">
      <b>Score: ${d.total}/20 (${d.percentage}%) — ${d.pass?'PASS':'FAIL'}</b><br>
      ${d.pass && d.certificate ? `Certificate: <b>${esc(d.certificate.CertCode)}</b> for ${esc(d.certificate.Name)}.` : (d.pass ? 'Certificate already issued.' : 'No certificate issued.')}
    </div>`;
    ev.target.reset(); renderDomainInputs();
    toast(d.pass ? '✓ Passed — certificate issued' : 'Recorded — did not pass');
  } catch(err){
    r.innerHTML = `<div class="alert error" style="margin-top:16px">${esc(err.message)}</div>`;
  } finally { btn.disabled = false; btn.innerHTML = orig; }
}

function viewRecords(){ return `<div class="card"><h2>📊 OSCE Records</h2><div id="records-list"><div class="empty"><div class="icon">⏳</div>Loading…</div></div></div>`; }

      <tbody>${d.records.map(r=>`<tr>
        <td>${fmt(r.Timestamp)}</td><td>${esc(r.LearnerEmail)}</td><td>${esc(r.AssessorEmail)}</td>
        <td>${esc(r.TotalScore)}/20</td><td><b>${esc(r.Percentage)}%</b></td>
        <td><span class="badge ${r.Outcome==='PASS'?'active':'suspended'}">${esc(r.Outcome)}</span></td>
      </tr>`).join('')}</tbody></table></div>`;
  } catch(e){ $('#records-list').innerHTML = `<div class="alert error">${esc(e.message)}</div>`; }

function viewCerts(){ return `<div class="card"><h2>🏆 Issued Certificates</h2><div id="certs-list"><div class="empty"><div class="icon">⏳</div>Loading…</div></div></div>`; }
async function loadCerts(){

    el.innerHTML = `<div class="tbl-scroll"><table>
      <thead><tr><th>Name</th><th>Email</th><th>Score</th><th>Code</th><th>Issued</th><th>Valid until</th></tr></thead>
      <tbody>${d.certificates.map(c=>`<tr>
        <td><b>${esc(c.Name)}</b></td><td>${esc(c.Email)}</td><td>${esc(c.Percentage)}%</td>
        <td><code>${esc(c.CertCode)}</code></td><td>${fmt(c.IssuedAt)}</td><td>${fmt(c.ValidUntil)}</td>
      </tr>`).join('')}</tbody></table></div>`;
  } catch(e){ $('#certs-list').innerHTML = `<div class="alert error">${esc(e.message)}</div>`; }
}

async function changeRole(email, role){
  try { await api('updateUser', { token: currentToken(), email, role }); toast('Role updated'); loadUsers(); } catch(e){ toast(e.message); }
}
async function changeStatus(email, status){

}
async function deleteUser(email){
  if(!confirm('Delete user ' + email + '?')) return;
  try { await api('deleteUser', { token: currentToken(), email }); toast('User deleted'); loadUsers(); } catch(e){ toast(e.message); }
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot(){
  const s = getSession();
  if(s?.token && s?.user){
    render();
    api('me', { token: s.token })
      .then(d => setSession({ token: s.token, user: d.user, issued: s.issued }))
      .catch(() => { clearSession(); render(); });
  } else if(s?.token){
    api('me', { token: s.token })
      .then(d => { setSession({ token: s.token, user: d.user }); render(); })
      .catch(() => { clearSession(); render(); });
  } else {
    render();
  }
})();
